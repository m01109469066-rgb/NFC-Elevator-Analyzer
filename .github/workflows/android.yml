
name: Build NFC Elevator APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: unzip -q NFCElevatorAnalyzer-Android-Project.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: NFCElevatorAnalyzer
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Elevator-Analyzer-APK
          path: NFCElevatorAnalyzer/app/build/outputs/apk/debug/app-debug.apk
          
